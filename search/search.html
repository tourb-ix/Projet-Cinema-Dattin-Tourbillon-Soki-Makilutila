<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recherche</title>

    <!--mise en page générale-->
    <link rel="stylesheet" href="../common/common.css">
    <link rel="stylesheet" href="../search/search.css">
    <!--icone de l'onglet-->
    <link rel="icon" href="../common/images/logo_cinema.png">
    <!--avoir des icônes réseaux sociaux via une API DOM-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<body>
    <header id="entete">
    </header>

  <div class="page">

        <aside id="side-bar">
            <div class="toggle-btn" id="btn">
                <span id="span_haut"></span>
                <span id="span_milieu"></span>
                <span id="span_bas"></span>
            </div>

            <div id="film_suggere"></div>
        </aside>

        <main class="content">
            <h2>Un film en particulier?</h2>
            <div id="option_affichage">
                <input type="text" id="recherche" placeholder="Rechercher un film"/>
                <select id="categorieSelect">
                    <option value="toutes">Toutes les catégories</option>
                    <!--Remplit en javascript selon le tableau de films-->
                </select>
                <select id="date">
                    <option value="recent">Récent</option>
                    <option value="ancien">Ancien</option>
                </select>
            </div>
            <div id="tableau">
                <table>
                    <thead>
                        <tr>
                            <th>Poster</th>
                            <th>Titre</th>
                            <th>Réalisateur</th>
                            <th>Catégorie</th>
                            <th>Année de sortie</th>
                        </tr>
                    </thead>
                    <tbody id="list_films">
                        <!--Remplit en javascript-->
                    </tbody>
                </table>
                <p id="chargement">
                    <i class="fas fa-spinner fa-spin"></i> Chargement en cours...
                </p>
            </div>
        </main>

    </div>

    <footer id="pied_de_page">
    </footer>

    <script src="../common/common.js" type="text/javascript"></script>
    <script src="../search/search.js" type="module"></script>
</body>

</html>
