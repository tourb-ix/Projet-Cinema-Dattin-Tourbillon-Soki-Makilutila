<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>

    <!--mise en page générale-->
    <link rel="stylesheet" href="../common/common.css"> 
    <!--icone de l'onglet-->
    <link rel="icon" href="../common/images/logo_cinema.png">
    <!--avoir des icônes réseaux sociaux via une API DOM-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- galerie de films -->
    <link href="../index/index.css" rel="stylesheet" />
</head>
<body>
    <header id="entete"></header>

<div class="page">

    <aside id="side-bar">
        <div class="toggle-btn" id="btn">
            <span id="span_haut"></span>
            <span id="span_milieu"></span>
            <span id="span_bas"></span>
        </div>

        <div id="film_suggere"></div>
    </aside>

    <main class="content">
        <div class="container">
            
            <h2>À la une</h2>

            <div id="caroussel">
                <button id="precedent" type="button" aria-label="Film précédent">←</button>
                <div id="film-vedette"></div>
                <button id="suivant" type="button" aria-label="Film suivant">→</button>
            </div>

            <h2>Films au cinéma</h2>

            <!-- Films (/index/index.js") -->
            <div id="galerie"></div>

            <!-- Indicateur de chargement (affiché par js/galerie.js) -->
            <p id="chargement">
                <i class="fas fa-spinner fa-spin"></i> Chargement en cours...
            </p>
        </div>
    </main>

</div>

<footer id="pied_de_page"></footer>
    
    <script src="../common/common.js" type="text/javascript"></script>
    <script src="../index/index.js" type="text/javascript"></script>
</body>

</html>
